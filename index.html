<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LocalityMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Field tool: header / one scrolling view / bottom tab bar. Tags are shown in mono, the way OSM editors show them. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e2e9e5; --fg:#13201a; --muted:#56665e; --line:#cdd8d2;
  --accent:#0d6b4e; --accent-fg:#ffffff; --mark:#f2a100; --add:#1d8656; --mod:#a86400; --bad:#b3261e; --info:#1f5fae;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411; --surface:#16201b; --sunk:#1d2923; --fg:#e4ece8; --muted:#94a59c; --line:#2b3832;
    --accent:#3fbf8d; --accent-fg:#06281b; --mark:#ffb51f; --add:#4cc489; --mod:#e0a040; --bad:#ff7a6e; --info:#7fb0ff; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;letter-spacing:.01em}
header.top .srv{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
header.top .srv.dev{background:var(--mod);color:#fff}
main{overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.view{padding:14px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 4px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
h2{font-size:20px;margin:4px 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pending{background:color-mix(in srgb,var(--mark) 22%,transparent);color:var(--mod)}
.pill.approved{background:color-mix(in srgb,var(--add) 20%,transparent);color:var(--add)}
.pill.rejected{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.uploaded{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.warn{border-left:3px solid var(--mod);padding:6px 10px;background:color-mix(in srgb,var(--mark) 12%,transparent);border-radius:6px;font-size:13px}
.err{border-left:3px solid var(--bad);padding:6px 10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:6px;font-size:13px}

/* capture */
#v-capture{padding:0;max-width:none;height:100%;position:relative;background:#000;color:#fff}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));gap:10px;pointer-events:none;background:linear-gradient(#000a,#0000)}
.hud .big{font:600 34px/1 var(--mono);font-variant-numeric:tabular-nums}
.hud .sub{font-size:13px;opacity:.85}
.hud .gps{text-align:right}
.hud .bad{color:#ffb4a8}
.crosshair{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1px dashed #ffffff66;pointer-events:none}
.capbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:16px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#0000,#000b)}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#ffffff33}
.shutter:active{background:#fff}
.capbar .btn{background:#ffffff22;border-color:#ffffff55;color:#fff}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.start p{max-width:36ch;opacity:.85;margin:0}

/* surveys */
.surveys{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.svy{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;cursor:pointer;text-align:left}
.svy img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--sunk)}
.svy .t{font-weight:600}
.empty{padding:30px 10px;text-align:center}

/* detail */
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dhead .title{flex:1;min-width:0}
.dhead .title b{display:block}
.panes{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.panes{grid-template-columns:1fr 1fr}}
.photo{position:relative;border-radius:12px;overflow:hidden;background:#000;line-height:0;touch-action:manipulation}
.photo img{width:100%;height:auto;display:block}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
#map{height:340px;border-radius:12px;border:1px solid var(--line);z-index:0}
@media (min-width:820px){#map{height:100%;min-height:340px}}
.headbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.headbar .val{font:600 18px var(--mono);min-width:5.5ch;text-align:center;font-variant-numeric:tabular-nums}
.chg{display:grid;gap:8px}
.chg .top{display:flex;gap:8px;align-items:center}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--mark);color:#1b1300;flex:none}
.chg .name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
table.diff{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px}
table.diff td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.diff td.k{color:var(--muted);width:38%}
.old{color:var(--bad);text-decoration:line-through}
.new{color:var(--add);font-weight:600}
.none{color:var(--muted)}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px}

/* sheet */
dialog#sheet{border:0;padding:0;width:min(640px,100%);max-height:92vh;margin:auto auto 0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--fg)}
@media (min-width:700px){dialog#sheet{margin:auto;border-radius:18px}}
dialog#sheet::backdrop{background:#0008}
.sheet{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.field label{font-size:14px}
.field .cur{font:12px var(--mono);color:var(--muted);text-align:right}
.field input,.field select,.field textarea{grid-column:1/-1;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);min-height:42px}
.field textarea{min-height:90px}
input[type=range]{width:100%}
.settings .field{margin-bottom:14px}
.code{font:13px var(--mono);background:var(--sunk);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;user-select:all}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,520px);z-index:1000;font-size:14px;box-shadow:0 6px 24px #0004}
.lf-cam{background:none;border:0}
.lf-num{background:var(--mark);color:#1b1300;border:2px solid #fff;border-radius:50%;font:600 12px/20px var(--mono);text-align:center;box-shadow:0 1px 4px #0006}
.lf-num.approved{background:var(--add);color:#fff}
.lf-num.rejected{background:#888;color:#fff}
.lf-num.uploaded{background:var(--info);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>LocalityMap</h1>
  <span class="srv" id="srvBadge"></span>
</header>
<main id="main">
  <section id="v-capture" class="view" hidden>
    <video id="video" playsinline muted autoplay></video>
    <div class="crosshair"></div>
    <div class="hud">
      <div><div class="big" id="hudHead">---°</div><div class="sub" id="hudHeadSub">compass off</div></div>
      <div class="gps"><div class="big" id="hudAcc" style="font-size:22px">GPS</div><div class="sub" id="hudGpsSub">waiting</div></div>
    </div>
    <div class="start" id="startPane">
      <h2 style="color:#fff">Survey a street</h2>
      <p>Point the camera along what you want to map. LocalityMap records where you stand and which way the camera faces, so each mark on the photo becomes a position on the map.</p>
      <button class="btn primary" id="btnStart">Start camera, compass and GPS</button>
      <label class="btn" style="background:#ffffff22;border-color:#ffffff55;color:#fff">Import a photo<input type="file" accept="image/jpeg,image/*" id="importFile" hidden></label>
    </div>
    <div class="capbar" id="capBar" hidden>
      <label class="btn">Import<input type="file" accept="image/jpeg,image/*" id="importFile2" hidden></label>
      <button class="shutter" id="btnShoot" aria-label="Take survey photo"></button>
      <button class="btn" id="btnStop">Stop</button>
    </div>
  </section>
  <section id="v-surveys" class="view" hidden></section>
  <section id="v-detail" class="view" hidden></section>
  <section id="v-upload" class="view" hidden></section>
  <section id="v-settings" class="view settings" hidden></section>
</main>
<nav class="tabs" id="tabs">
  <button data-v="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Capture</button>
  <button data-v="surveys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Surveys</button>
  <button data-v="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M4 15v5h16v-5"/></svg>Upload</button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/></svg>Settings</button>
</nav>
<dialog id="sheet"></dialog>
<div id="toast" hidden></div>

<script>
'use strict';
const VERSION = '0.1.0';
const APP = 'LocalityMap ' + VERSION;

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const norm360 = a => ((a % 360) + 360) % 360;
const card8 = d => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(norm360(d) / 45) % 8];
const fmtM = m => m == null ? '?' : (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m';
let toastTimer;
function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms); }
function loadLS(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

/* ---------- settings ---------- */
const DEFAULTS = { server: 'prod', clientId: '', hfov: 66, camHeight: 1.5, declination: 0, signin: 'redirect' };
let S = Object.assign({}, DEFAULTS, loadLS('gt.settings', {}));
const SERVERS = {
  prod: { label: 'OpenStreetMap', api: 'https://api.openstreetmap.org', web: 'https://www.openstreetmap.org' },
  dev: { label: 'Dev sandbox', api: 'https://master.apis.dev.openstreetmap.org', web: 'https://master.apis.dev.openstreetmap.org' }
};
const srv = () => SERVERS[S.server];
function saveSettings() { saveLS('gt.settings', S); updateBadge(); }
function updateBadge() { const b = $('#srvBadge'); b.textContent = srv().label; b.classList.toggle('dev', S.server === 'dev'); }

/* ---------- storage (IndexedDB keeps photos on the phone) ---------- */
const store = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('localitymap', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('obs', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('obs', mode); const r = fn(t.objectStore('obs')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return { put: o => tx('readwrite', s => s.put(o)), all: () => tx('readonly', s => s.getAll()), del: id => tx('readwrite', s => s.delete(id)) };
})();
const OBS = new Map();
const saveTimers = {};
function saveObs(o) { clearTimeout(saveTimers[o.id]); saveTimers[o.id] = setTimeout(() => store.put(o).catch(e => toast('Could not save: ' + e.message)), 250); }
const photoURLs = new Map();
const photoURL = o => { if (!photoURLs.has(o.id)) photoURLs.set(o.id, URL.createObjectURL(o.photo)); return photoURLs.get(o.id); };

/* ---------- presets: the tags BeamNG.Earth reads ---------- */
const ROADS = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'unclassified', 'residential', 'service', 'living_street', 'motorway_link', 'trunk_link', 'primary_link', 'secondary_link', 'tertiary_link', 'road', 'track'];
const isRoad = t => ROADS.includes(t.highway);
const YN = ['yes', 'no'];
const PRESETS = {
  road: { label: 'Road', group: 'fix', type: 'way', match: isRoad, fields: [
    { k: 'lanes', label: 'Lanes (both directions)', t: 'num', step: 1 },
    { k: 'width', label: 'Road width, kerb to kerb (m)', t: 'num', step: 0.1 },
    { k: 'maxspeed', label: 'Speed limit (km/h)', t: 'num', step: 10 },
    { k: 'surface', label: 'Surface', t: 'sel', opts: ['asphalt', 'concrete', 'chipseal', 'paving_stones', 'sett', 'compacted', 'gravel', 'unpaved', 'dirt'] },
    { k: 'oneway', label: 'One way', t: 'sel', opts: ['yes', 'no', '-1'] },
    { k: 'sidewalk', label: 'Footpaths', t: 'sel', opts: ['both', 'left', 'right', 'no', 'separate'] },
    { k: 'lit', label: 'Street lighting', t: 'sel', opts: YN },
    { k: 'lane_markings', label: 'Lane markings painted', t: 'sel', opts: YN },
    { k: 'shoulder', label: 'Sealed shoulder', t: 'sel', opts: ['both', 'left', 'right', 'no'] }
  ] },
  building: { label: 'Building', group: 'fix', type: 'way', match: t => !!t.building, fields: [
    { k: 'building:levels', label: 'Storeys above ground', t: 'num', step: 1 },
    { k: 'height', label: 'Height to top of roof (m)', t: 'num', step: 0.5 },
    { k: 'roof:shape', label: 'Roof shape', t: 'sel', opts: ['flat', 'gabled', 'hipped', 'skillion', 'half-hipped', 'pyramidal', 'gambrel', 'dome'] },
    { k: 'roof:levels', label: 'Storeys inside roof', t: 'num', step: 1 },
    { k: 'building:material', label: 'Wall material', t: 'sel', opts: ['brick', 'concrete', 'cement_block', 'plaster', 'wood', 'metal', 'glass', 'stone'] },
    { k: 'roof:material', label: 'Roof material', t: 'sel', opts: ['roof_tiles', 'metal', 'concrete', 'asbestos', 'glass'] }
  ] },
  street_lamp: { label: 'Street light', group: 'add', type: 'node', tags: { highway: 'street_lamp' } },
  traffic_signals: { label: 'Traffic signals', group: 'add', type: 'node', onWay: true, tags: { highway: 'traffic_signals' } },
  stop: { label: 'Stop sign', group: 'add', type: 'node', onWay: true, autoDir: true, tags: { highway: 'stop' }, fields: [
    { k: 'direction', label: 'Traffic it controls (along the OSM way)', t: 'sel', opts: ['forward', 'backward'] }] },
  give_way: { label: 'Give way sign', group: 'add', type: 'node', onWay: true, autoDir: true, tags: { highway: 'give_way' }, fields: [
    { k: 'direction', label: 'Traffic it controls (along the OSM way)', t: 'sel', opts: ['forward', 'backward'] }] },
  crossing: { label: 'Pedestrian crossing', group: 'add', type: 'node', onWay: true, tags: { highway: 'crossing' }, fields: [
    { k: 'crossing', label: 'Crossing type', t: 'sel', opts: ['traffic_signals', 'uncontrolled', 'unmarked'] },
    { k: 'crossing_ref', label: 'Zebra stripes', t: 'sel', opts: ['zebra'] }
  ] },
  hump: { label: 'Speed hump', group: 'add', type: 'node', onWay: true, tags: { traffic_calming: 'hump' } },
  power_pole: { label: 'Power pole', group: 'add', type: 'node', tags: { power: 'pole' } },
  tree: { label: 'Tree', group: 'add', type: 'node', tags: { natural: 'tree' } },
  note: { label: 'Note for other mappers', group: 'other', type: 'note' }
};
const GROUPS = { fix: 'Correct what is mapped', add: 'Add something missing', other: 'Something else' };

/* ---------- sensors ---------- */
const sensors = { heading: null, src: null, elev: null, samples: [], pos: null, started: false, stream: null, geoId: null };
// Compass direction of the rear camera from W3C device orientation (alpha, beta, gamma, Earth frame).
function backHeading(alpha, beta, gamma) {
  const a = alpha * D2R, b = beta * D2R, g = gamma * D2R;
  const east = -Math.cos(a) * Math.sin(g) - Math.sin(a) * Math.sin(b) * Math.cos(g);
  const north = -Math.sin(a) * Math.sin(g) + Math.cos(a) * Math.sin(b) * Math.cos(g);
  return norm360(Math.atan2(east, north) * R2D);
}
function onOrient(e) {
  let hd = null, src = null;
  if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) { hd = e.webkitCompassHeading; src = 'compass (iOS)'; }
  else if ((e.absolute || e.type === 'deviceorientationabsolute') && e.alpha != null) { hd = backHeading(e.alpha, e.beta, e.gamma); src = 'compass'; }
  if (e.beta != null) { const B = e.beta * D2R, G = (e.gamma || 0) * D2R; sensors.elev = Math.asin(Math.max(-1, Math.min(1, -Math.cos(B) * Math.cos(G)))) * R2D; }
  if (hd == null) return;
  hd = norm360(hd + Number(S.declination || 0));
  const now = performance.now();
  sensors.samples.push({ t: now, h: hd });
  while (sensors.samples.length && now - sensors.samples[0].t > 1200) sensors.samples.shift();
  sensors.src = src;
}
function smoothHeading() {
  const s = sensors.samples; if (!s.length) return null;

  const r = await fetch(`${SERVERS[p.server].web}/oauth2/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: redirectUri(), client_id: S.clientId, code_verifier: p.ver }) });
  if (!r.ok) throw new Error('Token request failed: ' + r.status + ' ' + (await r.text()).slice(0, 160));
  const j = await r.json(); S.server = p.server; saveSettings(); saveLS(tokenKey(), j.access_token); localStorage.removeItem('gt.pkce');
  await loadUser();
}
async function handleOAuthReturn() {
  const q = new URLSearchParams(location.search); if (!q.has('code') && !q.has('error')) return false;
  history.replaceState(null, '', location.pathname);
  if (q.has('error')) { toast('Sign-in cancelled: ' + q.get('error')); return true; }
  const p = loadLS('gt.pkce', null);
  if (!p || p.state !== q.get('state')) { toast('Sign-in did not match a request from this app. Try again.'); return true; }
  try { await exchangeCode(q.get('code')); toast('Signed in.'); } catch (e) { toast(e.message, 7000); }
  return true;
}
let USER = null;
async function loadUser() {
  const t = getToken(); USER = null; if (!t) return;
  try { const r = await fetch(srv().api + '/api/0.6/user/details.json', { headers: { Authorization: 'Bearer ' + t } }); if (r.status === 401) { localStorage.removeItem(tokenKey()); return; } USER = (await r.json()).user; } catch {}
}
async function api(path, opt = {}) {
  const t = getToken(); if (!t) throw new Error('Not signed in.');
  const r = await fetch(srv().api + path, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + t } });
  if (!r.ok) throw new Error(`${opt.method || 'GET'} ${path.split('?')[0]} failed: ${r.status} ${(await r.text()).slice(0, 200)}`);
  return r;
}

/* ---------- compile approved marks into an osmChange ---------- */
function approved() {
  const out = [];
  for (const o of OBS.values()) o.anns.forEach(a => { if (a.status === 'approved') out.push({ o, a }); });
  return out;
}
async function compile(online) {
  const items = approved(); const errors = [];
  const tagEdits = {}, inserts = {}, creates = [], notes = [], used = [];
  let tmp = -1;
  for (const { o, a } of items) {
    const P = PRESETS[a.preset];
    if (!o.osm || o.osm.server !== S.server) { errors.push(`Skipped a ${P.label.toLowerCase()}: its OSM data is from another server or not loaded.`); continue; }
    if (P.type === 'way') {
      if (!a.wayId) { errors.push(`Skipped ${P.label.toLowerCase()} edit: no target.`); continue; }
      const diff = annDiff(o, a); if (!diff.length) continue;
      tagEdits[a.wayId] = Object.assign(tagEdits[a.wayId] || {}, Object.fromEntries(diff.map(d => [d.k, d.to])));
      used.push({ o, a });
    } else if (P.type === 'node') {
      const id = tmp--; creates.push({ id, lat: a.lat, lon: a.lon, tags: Object.fromEntries(annDiff(o, a).map(d => [d.k, d.to])), label: P.label });
      if (P.onWay && a.wayId && a.seg) (inserts[a.wayId] = inserts[a.wayId] || []).push({ ...a.seg, id });
      used.push({ o, a });
    } else if (P.type === 'note') { if ((a.text || '').trim()) notes.push({ o, a }); }
  }
  const ids = [...new Set([...Object.keys(tagEdits), ...Object.keys(inserts)])];
  const fresh = {};
  if (ids.length) {
    if (online) {
      for (let i = 0; i < ids.length; i += 100) {
        const r = await fetch(`${srv().api}/api/0.6/ways.json?ways=${ids.slice(i, i + 100).join(',')}`);
        if (!r.ok) throw new Error('Could not fetch current versions: ' + r.status);
        for (const el of (await r.json()).elements) fresh[el.id] = { tags: el.tags || {}, nds: el.nodes, v: el.version };
      }
    } else for (const { o } of items) for (const id of ids) if (o.osm && o.osm.ways[id] && !fresh[id]) fresh[id] = JSON.parse(JSON.stringify(o.osm.ways[id]));
  }
  const modifies = [];
  for (const id of ids) {
    const w = fresh[id]; if (!w) { errors.push(`Way ${id} no longer exists; its changes were skipped.`); continue; }
    const tags = Object.assign({}, w.tags, tagEdits[id] || {}); let nds = w.nds.slice();
    const bySeg = {};
    for (const ins of inserts[id] || []) (bySeg[ins.from + '_' + ins.to] = bySeg[ins.from + '_' + ins.to] || []).push(ins);
    for (const group of Object.values(bySeg)) {
      const { from, to } = group[0]; let i = -1, rev = false;
      for (let k = 0; k < nds.length - 1; k++) { if (nds[k] === from && nds[k + 1] === to) { i = k; break; } if (nds[k] === to && nds[k + 1] === from) { i = k; rev = true; break; } }
      if (i < 0) { errors.push(`Way ${id} changed shape since the survey; ${group.length} point(s) were added unattached.`); continue; }
      group.sort((x, y) => rev ? y.u - x.u : x.u - y.u);
      nds.splice(i + 1, 0, ...group.map(g => g.id));
    }
    modifies.push({ id, v: w.v, tags, nds });
  }
  const tally = {}; creates.forEach(c => tally[c.label] = (tally[c.label] || 0) + 1);
  const edited = { road: 0, building: 0 }; const keys = new Set();
  for (const id of Object.keys(tagEdits)) { const w = fresh[id]; if (w && isRoad(w.tags)) edited.road++; else edited.building++; Object.keys(tagEdits[id]).forEach(k => keys.add(k)); }
  const parts = [];
  if (creates.length) parts.push('added ' + Object.entries(tally).map(([k, n]) => n + ' ' + k.toLowerCase() + (n > 1 ? 's' : '')).join(', '));
  if (edited.road || edited.building) parts.push('updated ' + [edited.road && edited.road + ' road' + (edited.road > 1 ? 's' : ''), edited.building && edited.building + ' building' + (edited.building > 1 ? 's' : '')].filter(Boolean).join(' and ') + ' (' + [...keys].join(', ') + ')');
  return { creates, modifies, notes, used, errors, summary: parts.length ? 'Ground survey: ' + parts.join('; ') : '' };
}
function oscXml(c, cs) {
  const csAttr = cs ? ` changeset="${cs}"` : '';
  const tags = t => Object.entries(t).map(([k, v]) => `<tag k="${esc(k)}" v="${esc(v)}"/>`).join('');
  let x = `<?xml version="1.0" encoding="UTF-8"?>\n<osmChange version="0.6" generator="${esc(APP)}">\n<create>\n`;
  for (const n of c.creates) x += `<node id="${n.id}" lat="${n.lat.toFixed(7)}" lon="${n.lon.toFixed(7)}" version="0"${csAttr}>${tags(n.tags)}</node>\n`;
  x += '</create>\n<modify>\n';
  for (const w of c.modifies) x += `<way id="${w.id}" version="${w.v}"${csAttr}>${w.nds.map(n => `<nd ref="${n}"/>`).join('')}${tags(w.tags)}</way>\n`;
  return x + '</modify>\n</osmChange>\n';
}

/* ---------- upload screen ---------- */
let busy = false;
async function renderUpload(showCode) {
  const v = $('#v-upload'); v.innerHTML = '';
  v.append(h('h2', {}, 'Upload to ' + srv().label));
  if (getToken() && !USER) await loadUser();
  const acct = h('div', { class: 'card row' });
  if (USER) acct.append(h('span', { style: 'flex:1' }, 'Signed in as ', h('b', {}, USER.display_name)), h('button', { class: 'btn small', onclick: () => { localStorage.removeItem(tokenKey()); USER = null; renderUpload(); } }, 'Sign out'));
  else acct.append(h('span', { style: 'flex:1' }, 'Sign in with your OSM account to upload.'), h('button', { class: 'btn primary', onclick: signIn }, 'Sign in'));
  v.append(acct);
  if (showCode || (S.signin === 'oob' && loadLS('gt.pkce', null) && !USER)) {
    const inp = h('input', { id: 'f-code', placeholder: 'Paste the code OSM showed you' });
    v.append(h('div', { class: 'card stack', style: 'margin-top:10px' }, h('div', { class: 'field' }, h('label', { for: 'f-code' }, 'Authorization code'), inp),
      h('button', { class: 'btn primary', onclick: async () => { try { await exchangeCode(inp.value.trim()); toast('Signed in.'); renderUpload(); } catch (e) { toast(e.message, 7000); } } }, 'Finish sign-in')));
  }
  const items = approved();
  const pend = [...OBS.values()].reduce((n, o) => n + o.anns.filter(a => a.status === 'pending').length, 0);
  v.append(h('h3', {}, 'Ready to send'));
  if (!items.length) { v.append(h('p', { class: 'muted' }, pend ? `Nothing approved yet. ${pend} mark(s) are waiting for review in Surveys.` : 'Nothing approved yet. Approve marks in Surveys first.')); return; }
  let c;
  try { c = await compile(navigator.onLine); } catch (e) { v.append(h('div', { class: 'err' }, e.message)); return; }
  const list = h('div', { class: 'card stack' });
  c.creates.forEach(n => list.append(h('div', { class: 'mono' }, h('span', { class: 'new' }, '+ node '), Object.entries(n.tags).map(([k, x]) => k + '=' + x).join(' '), h('span', { class: 'muted' }, ` @ ${n.lat.toFixed(5)},${n.lon.toFixed(5)}`))));
  c.modifies.forEach(w => { list.append(h('div', { class: 'mono' }, h('span', { class: 'new', style: 'color:var(--mod)' }, '~ way ' + w.id + ' '), w.tags.name || w.tags.highway || 'building', ' (v' + w.v + ')')); });
  c.notes.forEach(({ a }) => list.append(h('div', { class: 'mono' }, h('span', { class: 'new', style: 'color:var(--info)' }, '! note '), (a.text || '').slice(0, 80))));
  v.append(list);
  c.errors.forEach(e => v.append(h('div', { class: 'warn', style: 'margin-top:8px' }, e)));
  const comment = h('textarea', { id: 'f-comment', style: 'min-height:70px' }, c.summary);
  v.append(h('div', { class: 'field', style: 'margin-top:12px' }, h('label', { for: 'f-comment' }, 'Changeset comment (what and why, visible to everyone)'), comment));
  v.append(h('p', { class: 'muted', style: 'font-size:13px' }, 'Tagged source=survey with today\'s date. Your photos stay on this phone.'));
  if (S.server === 'prod') v.append(h('div', { class: 'warn' }, 'This writes to the live OpenStreetMap database under your name. Switch to the dev sandbox in Settings to rehearse.'));
  const out = h('div', { class: 'stack', style: 'margin-top:10px' });
  const hasEdits = c.creates.length || c.modifies.length;
  v.append(h('div', { class: 'row', style: 'margin-top:12px' },
    hasEdits ? h('button', { class: 'btn primary', disabled: !USER, onclick: e => doUpload(e.target, comment.value.trim(), out) }, `Upload ${c.creates.length + c.modifies.length} change${c.creates.length + c.modifies.length > 1 ? 's' : ''}`) : null,
    c.notes.length ? h('button', { class: 'btn', disabled: !USER, onclick: e => postNotes(e.target, out) }, `Post ${c.notes.length} note${c.notes.length > 1 ? 's' : ''}`) : null,
    hasEdits ? h('button', { class: 'btn', onclick: () => exportOsc(c) }, 'Export .osc for JOSM') : null), out);
}
async function doUpload(btn, comment, out) {
  if (busy) return; if (!comment) return toast('Write a changeset comment first.');
  busy = true; btn.disabled = true; btn.textContent = 'Uploading…'; let cs = null;
  try {
    const c = await compile(true);
    if (c.errors.length) out.append(...c.errors.map(e => h('div', { class: 'warn' }, e)));
    const tags = { created_by: APP, comment, source: 'survey', 'survey:date': new Date().toISOString().slice(0, 10) };
    const body = `<osm><changeset>${Object.entries(tags).map(([k, v]) => `<tag k="${esc(k)}" v="${esc(v)}"/>`).join('')}</changeset></osm>`;
    cs = (await (await api('/api/0.6/changeset/create', { method: 'PUT', headers: { 'Content-Type': 'text/xml' }, body })).text()).trim();
    await api(`/api/0.6/changeset/${cs}/upload`, { method: 'POST', headers: { 'Content-Type': 'text/xml' }, body: oscXml(c, cs) });
    await api(`/api/0.6/changeset/${cs}/close`, { method: 'PUT' });
    const link = `${srv().web}/changeset/${cs}`;
    for (const { o, a } of c.used) { a.status = 'uploaded'; a.result = 'In changeset ' + cs; saveObs(o); }
    out.append(h('div', { class: 'card' }, 'Uploaded as changeset ', h('a', { href: link, target: '_blank', rel: 'noopener' }, cs), '. BeamNG.Earth will pick it up once its map sources refresh.'));
    btn.textContent = 'Done';
  } catch (e) {
    out.append(h('div', { class: 'err' }, e.message + (e.message.includes('409') ? ' Someone edited this way since you loaded it; reload the survey\'s OSM data and try again.' : '')));
    if (cs) api(`/api/0.6/changeset/${cs}/close`, { method: 'PUT' }).catch(() => {});
    btn.disabled = false; btn.textContent = 'Try again';
  } finally { busy = false; }
}
async function postNotes(btn, out) {
  if (busy) return; busy = true; btn.disabled = true;
  try {
    const c = await compile(true);
    for (const { o, a } of c.notes) {
      const text = a.text.trim() + `\n\n(Surveyed on the ground ${o.created.slice(0, 10)}, looking ${Math.round(a.bearing)}° from ${o.cam.lat.toFixed(6)},${o.cam.lon.toFixed(6)}.)`;
      const r = await api('/api/0.6/notes.json?' + new URLSearchParams({ lat: a.lat.toFixed(6), lon: a.lon.toFixed(6), text }), { method: 'POST' });
      const j = await r.json(); a.status = 'uploaded'; a.result = 'Note ' + j.properties.id; saveObs(o);
      out.append(h('div', { class: 'card' }, 'Posted ', h('a', { href: `${srv().web}/note/${j.properties.id}`, target: '_blank', rel: 'noopener' }, 'note ' + j.properties.id)));
    }
    btn.textContent = 'Posted';
  } catch (e) { out.append(h('div', { class: 'err' }, e.message)); btn.disabled = false; } finally { busy = false; }
}
async function exportOsc(c) {
  const name = `localitymap-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '')}.osc`;
  const file = new File([oscXml(c)], name, { type: 'application/xml' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = h('a', { href: URL.createObjectURL(file), download: name }); document.body.append(a); a.click(); a.remove();
}

/* ---------- settings ---------- */
function renderSettings() {
  const v = $('#v-settings'); v.innerHTML = '';
  v.append(h('h2', {}, 'Settings'));
  const num = (k, label, step, hint) => { const id = 'set-' + k; const i = h('input', { id, type: 'number', inputmode: 'decimal', step, value: S[k] }); i.onchange = () => { S[k] = Number(i.value); saveSettings(); }; return h('div', { class: 'field' }, h('label', { for: id }, label), h('span', { class: 'cur' }, hint || ''), i); };
  const sel = (k, label, opts) => { const id = 'set-' + k; const s = h('select', { id }, Object.entries(opts).map(([val, l]) => h('option', { value: val, selected: S[k] === val }, l))); s.onchange = () => { S[k] = s.value; saveSettings(); USER = null; renderSettings(); }; return h('div', { class: 'field' }, h('label', { for: id }, label), s); };
  v.append(h('h3', {}, 'OpenStreetMap account'));
  v.append(sel('server', 'Server', { prod: 'OpenStreetMap (live)', dev: 'Dev sandbox (test edits)' }));
  const cid = h('input', { id: 'set-client', value: S.clientId, placeholder: 'from your OAuth 2 application', autocomplete: 'off' });
  cid.onchange = () => { S.clientId = cid.value.trim(); saveSettings(); };
  v.append(h('div', { class: 'field' }, h('label', { for: 'set-client' }, 'Client ID'), cid));
  v.append(sel('signin', 'Sign-in method', { redirect: 'Return to this app automatically', oob: 'Copy a code by hand (for installed iPhone app)' }));
  v.append(h('p', { class: 'muted', style: 'font-size:13px;margin:0 0 6px' }, `Register an app at ${srv().web}/oauth2/applications/new as a public (non-confidential) client with permissions "Read user preferences", "Modify the map" and "Modify notes". Use this redirect URI:`));
  v.append(h('div', { class: 'code' }, redirectUri()));
  v.append(h('h3', {}, 'Camera and compass'));
  v.append(num('hfov', 'Camera field of view, long side (°)', 1, 'most phones 63–70'));
  v.append(num('camHeight', 'Camera height above ground (m)', 0.1, 'used for tilt distances'));
  v.append(num('declination', 'Magnetic declination (°, east positive)', 0.1, 'added to compass readings'));
  v.append(h('p', { class: 'muted', style: 'font-size:13px' }, 'To calibrate the field of view: photograph two posts you can find on the map, then adjust this until both line up with the OSM overlay at the same heading.'));
  v.append(h('h3', {}, 'Data on this phone'));
  const up = [...OBS.values()].filter(o => o.anns.length && o.anns.every(a => a.status === 'uploaded' || a.status === 'rejected'));
  v.append(h('div', { class: 'row' }, h('span', { class: 'muted', style: 'flex:1' }, `${OBS.size} surveys stored, ${up.length} fully done.`),
    up.length ? h('button', { class: 'btn small danger', onclick: async () => { for (const o of up) { OBS.delete(o.id); await store.del(o.id); } renderSettings(); toast('Removed finished surveys.'); } }, 'Remove finished') : null));
  v.append(h('p', { class: 'muted', style: 'font-size:12px;margin-top:24px' }, APP + ' · map data © OpenStreetMap contributors, ODbL'));
}

for (const b of document.querySelectorAll('#tabs button')) b.addEventListener('click', () => go(b.dataset.v));
$('#btnStart').addEventListener('click', startSensors);
$('#btnShoot').addEventListener('click', shoot);
$('#btnStop').addEventListener('click', stopAll);
for (const id of ['importFile', 'importFile2']) $('#' + id).addEventListener('change', e => { importPhoto(e.target.files[0]).catch(err => toast(err.message)); e.target.value = ''; });
(async () => {
  updateBadge();
  try { for (const o of await store.all()) OBS.set(o.id, o); } catch (e) { toast('Storage unavailable: ' + e.message); }
  const returned = await handleOAuthReturn();
  go(returned ? 'upload' : (OBS.size ? 'surveys' : 'capture'));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
