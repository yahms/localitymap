<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LocalityMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Field tool: header / one scrolling view / bottom tab bar. Tags are shown in mono, the way OSM editors show them. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e2e9e5; --fg:#13201a; --muted:#56665e; --line:#cdd8d2;
  --accent:#0d6b4e; --accent-fg:#ffffff; --mark:#f2a100; --add:#1d8656; --mod:#a86400; --bad:#b3261e; --info:#1f5fae;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411; --surface:#16201b; --sunk:#1d2923; --fg:#e4ece8; --muted:#94a59c; --line:#2b3832;
    --accent:#3fbf8d; --accent-fg:#06281b; --mark:#ffb51f; --add:#4cc489; --mod:#e0a040; --bad:#ff7a6e; --info:#7fb0ff; color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
header.top{grid-row:1} main{grid-row:2} nav.tabs{grid-row:3}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;letter-spacing:.01em}
header.top .srv{margin-left:auto;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
header.top .srv.dev{background:var(--mod);color:#fff}
main{overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.view{padding:14px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 4px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.small{font-size:13px}
h2{font-size:20px;margin:4px 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pending{background:color-mix(in srgb,var(--mark) 22%,transparent);color:var(--mod)}
.pill.approved{background:color-mix(in srgb,var(--add) 20%,transparent);color:var(--add)}
.pill.rejected,.pill.merged{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.uploaded{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.pill.conflict{background:var(--bad);color:#fff}
.warn{border-left:3px solid var(--mod);padding:6px 10px;background:color-mix(in srgb,var(--mark) 12%,transparent);border-radius:6px;font-size:13px}
.err{border-left:3px solid var(--bad);padding:6px 10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:6px;font-size:13px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px #0002}

/* capture: full-screen camera; HUD across the top; control rail below the picture (beside it in landscape) */
#v-capture{padding:0;max-width:none;height:100%;position:relative;background:#000;color:#fff;overflow:hidden;--railw:0px;--railh:calc(108px + env(safe-area-inset-bottom,0px))}
body.cam header.top{display:none}
#video,#live{position:absolute;left:0;top:0;width:calc(100% - var(--railw));height:calc(100% - var(--railh))}
#video{object-fit:contain;background:#000}
#live{pointer-events:none}
.crosshair{position:absolute;left:calc((100% - var(--railw)) / 2);top:0;height:calc(100% - var(--railh));width:0;border-left:1px dashed #ffffff44;pointer-events:none}
.hud{position:absolute;left:0;right:var(--railw);top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 16px max(12px,env(safe-area-inset-left,0px));pointer-events:none;background:linear-gradient(#000b,#0000)}
.hud .big{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums}
.hud .sub{font-size:12px;opacity:.88;margin-top:3px}
.hud .gps{text-align:right}
.hud .bad{color:#ffb4a8}
.badge{justify-self:center;font:700 12px/1 var(--font);letter-spacing:.08em;padding:8px 12px;border-radius:99px;background:#1d8656;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.ready{background:#a86400}
.badge.rec{background:#d0261b}
.badge.off{background:#ffffff2e}
.hudwarn{position:absolute;left:calc((100% - var(--railw)) / 2);top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:#b3261ecc;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;width:max-content;max-width:88%;text-align:center}
.guide{position:absolute;left:calc((100% - var(--railw)) / 2);top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:#000c;color:#fff;border-radius:12px;padding:7px 12px;display:flex;gap:10px;align-items:center;width:max-content;max-width:min(88%,480px);font-size:13px;line-height:1.3}
.guide .arrow{width:30px;height:30px;flex:none}
.guide b{font-size:14px}
.mini{position:absolute;right:calc(var(--railw) + 10px);top:calc(env(safe-area-inset-top,0px) + 110px);width:min(42%,340px);height:min(34%,280px);border-radius:12px;border:2px solid #fff;overflow:hidden;z-index:0}
.drivestats{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--railh) + 10px);font:600 13px/1.35 var(--mono);text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;background:#0007;padding:6px 9px;border-radius:9px}
.intro{position:absolute;left:calc((100% - var(--railw)) / 2);top:calc((100% - var(--railh)) / 2);transform:translate(-50%,-50%);width:min(330px,calc(100% - 32px - var(--railw)));background:#121815ec;border-radius:14px;padding:14px 16px;text-align:center;font-size:14px;line-height:1.45}
.intro b{display:block;font-size:16px;margin-bottom:4px}
.rail{position:absolute;left:0;right:0;bottom:0;height:var(--railh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px));background:#0b0f0d}
.modes{display:inline-flex;background:#ffffff1f;border-radius:12px;padding:3px;gap:2px;justify-self:start}
.modes button{border:0;background:none;color:#fff;opacity:.7;padding:8px 12px;border-radius:9px;font:600 14px var(--font);min-height:40px;cursor:pointer;white-space:nowrap}
.modes button[aria-checked="true"]{background:#1d8656;opacity:1}
.modes button:disabled{opacity:.3;cursor:not-allowed}
.primary{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;transition:border-color .15s}
.primary .lbl{display:block;transition:all .15s}
.primary.start .lbl{font:700 15px var(--font)}
.primary.shutter .lbl{width:58px;height:58px;border-radius:50%;background:#fff}
.primary.shutter:active .lbl{transform:scale(.88)}
.primary.record .lbl{width:56px;height:56px;border-radius:50%;background:#e5352b}
.primary.stop{border-color:#e5352b}
.primary.stop .lbl{width:28px;height:28px;border-radius:6px;background:#e5352b}
.primary:focus-visible,.modes button:focus-visible,.toolbtn:focus-visible{outline:3px solid #7fb0ff;outline-offset:3px}
.toolbtn{justify-self:end;width:48px;height:48px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer}
.toolbtn[aria-expanded="true"]{background:#fff;color:#000}
.tools{position:absolute;right:calc(var(--railw) + max(12px,env(safe-area-inset-right,0px)));bottom:calc(var(--railh) + 10px);width:min(310px,calc(100% - 24px - var(--railw)));max-height:calc(100% - var(--railh) - 20px);overflow:auto;background:#121815f4;border:1px solid #ffffff2a;border-radius:14px;padding:6px;display:flex;flex-direction:column;z-index:5}
.tools label,.tools button{display:flex;align-items:center;gap:10px;padding:10px;border:0;background:none;color:#fff;font:15px var(--font);text-align:left;border-radius:9px;cursor:pointer;min-height:44px}
.tools label:hover,.tools button:hover{background:#ffffff14}
.tools .hint{font-size:12px;opacity:.65;margin-left:auto;white-space:nowrap}
.tools hr{border:0;border-top:1px solid #ffffff22;margin:4px 0;width:100%}
.tools input[type=checkbox]{width:20px;height:20px;accent-color:#1d8656;flex:none}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4b3e;margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (orientation:landscape) and (max-height:600px){
  body.cam nav.tabs{display:none}
  #v-capture{--railw:calc(124px + env(safe-area-inset-right,0px));--railh:0px}
  .rail{left:auto;top:0;width:var(--railw);height:100%;grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;justify-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 10px) 0}
  .modes{flex-direction:column;justify-self:center;align-self:start}
  .toolbtn{justify-self:center;align-self:end}
  .tools{top:10px;bottom:auto;max-height:calc(100% - 20px)}
  .drivestats{bottom:10px}
  .hud .big{font-size:20px}
}
.measurebar{display:flex;gap:8px;align-items:center;background:var(--accent);color:var(--accent-fg);padding:8px 12px;border-radius:10px;margin-bottom:8px;font-weight:600}
.measurebar .btn{margin-left:auto}
.framebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
.framebar .val{font:600 14px var(--mono);min-width:6ch;text-align:center}
/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.svy{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;cursor:pointer;text-align:left}
.svy img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--sunk)}
.svy .t{font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:10px}
.thumbs button{padding:0;border:0;background:var(--sunk);border-radius:8px;overflow:hidden;aspect-ratio:4/3;position:relative;cursor:pointer;max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .badge{position:absolute;right:4px;top:4px;background:var(--mark);color:#1b1300;font:600 11px var(--mono);padding:1px 5px;border-radius:6px}
.empty{padding:30px 10px;text-align:center}
.tagchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagchips span{font:12px var(--mono);background:var(--sunk);padding:1px 6px;border-radius:5px}

/* detail */
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dhead .title{flex:1;min-width:0}
.dhead .title b{display:block}
.panes{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){.panes{grid-template-columns:1fr 1fr}}
.photo{position:relative;border-radius:12px;overflow:hidden;background:#000;line-height:0;touch-action:manipulation}
.photo img{width:100%;height:auto;display:block}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.mapbox{height:340px;border-radius:12px;border:1px solid var(--line);z-index:0}
@media (min-width:820px){.mapbox{height:100%;min-height:340px}}
.headbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.headbar .adj{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;padding-right:6px}
.headbar .val.small{font-size:13px;min-width:4.5ch}
.headbar .val{font:600 18px var(--mono);min-width:5.5ch;text-align:center;font-variant-numeric:tabular-nums}
.chg{display:grid;gap:8px}
.chg .top{display:flex;gap:8px;align-items:center}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--mark);color:#1b1300;flex:none}
.chg .name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
table.diff{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px}
table.diff td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.diff td.k{color:var(--muted);width:38%}
.old{color:var(--bad);text-decoration:line-through}
.new{color:var(--add);font-weight:600}
.none{color:var(--muted)}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px}
.carousel{display:flex;align-items:center;gap:8px;margin:8px 0}
.carousel .pos{flex:1;text-align:center;font:13px var(--mono);color:var(--muted)}

/* sheet */
dialog#sheet{border:0;padding:0;width:min(640px,100%);max-height:92vh;margin:auto auto 0;border-radius:18px 18px 0 0;background:var(--surface);color:var(--fg)}
@media (min-width:700px){dialog#sheet{margin:auto;border-radius:18px}}
dialog#sheet::backdrop{background:#0008}
.sheet{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.field label{font-size:14px}
.field .cur{font:12px var(--mono);color:var(--muted);text-align:right}
.field input,.field select,.field textarea{grid-column:1/-1;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);min-height:42px}
.field textarea{min-height:90px}
input[type=range]{width:100%}
.settings .field{margin-bottom:14px}
.code{font:13px var(--mono);background:var(--sunk);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere;user-select:all}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,520px);z-index:1000;font-size:14px;box-shadow:0 6px 24px #0004}
.lf-cam{background:none;border:0}
.lf-num{background:var(--mark);color:#1b1300;border:2px solid #fff;border-radius:50%;font:600 12px/20px var(--mono);text-align:center;box-shadow:0 1px 4px #0006}
.lf-num.approved{background:var(--add);color:#fff}
.lf-num.rejected,.lf-num.merged{background:#888;color:#fff}
.lf-num.uploaded{background:var(--info);color:#fff}
.lf-dot{background:var(--info);border:2px solid #fff;border-radius:50%}
.lf-dot.cur{background:var(--mark)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>LocalityMap</h1>
  <span class="srv" id="srvBadge"></span>
</header>
<main id="main">
  <section id="v-capture" class="view" hidden>
    <video id="video" playsinline muted autoplay></video>
    <canvas id="live"></canvas>
    <div class="crosshair"></div>
    <div class="hud">
      <div><div class="big" id="hudHead">---°</div><div class="sub" id="hudHeadSub">sensors off</div></div>
      <div class="badge off" id="modeBadge">ON FOOT</div>
      <div class="gps"><div class="big" id="hudAcc">GPS</div><div class="sub" id="hudGpsSub">off</div></div>
    </div>
    <div class="hudwarn" id="hudWarn" hidden></div>
    <div class="guide" id="guide" hidden></div>
    <div class="mini" id="mini" hidden></div>
    <div class="drivestats" id="driveStats" hidden></div>
    <div class="intro" id="intro"></div>
    <div class="tools" id="tools" hidden></div>
    <div class="rail">
      <div class="modes" role="radiogroup" aria-label="Capture mode">
        <button role="radio" data-m="hand" aria-checked="true">On foot</button><button role="radio" data-m="drive" aria-checked="false">Drive</button>
      </div>
      <button class="primary start" id="btnPrimary"><span class="lbl">Start</span></button>
      <button class="toolbtn" id="btnTools" aria-label="More options" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </section>
  <section id="v-surveys" class="view" hidden></section>
  <section id="v-detail" class="view" hidden></section>
  <section id="v-road" class="view" hidden></section>
  <section id="v-area" class="view" hidden></section>
  <section id="v-check" class="view" hidden></section>
  <section id="v-upload" class="view" hidden></section>
  <section id="v-settings" class="view settings" hidden></section>
</main>
<nav class="tabs" id="tabs">
  <button data-v="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Capture</button>
  <button data-v="surveys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Review</button>
  <button data-v="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M4 15v5h16v-5"/></svg>Upload</button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/></svg>Settings</button>
</nav>
<dialog id="sheet"></dialog>
<div id="toast" hidden></div>

<script>
'use strict';
const VERSION = '0.4.0';
const APP = 'LocalityMap ' + VERSION;

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }

/* ================= auth (OAuth 2 + PKCE, no server needed) ================= */

  try { const r = await fetch(srv().api + '/api/0.6/user/details.json', { headers: { Authorization: 'Bearer ' + t } }); if (r.status === 401) { localStorage.removeItem(tokenKey()); return; } USER = (await r.json()).user; } catch {}

  const parts = [];
  if (creates.length) parts.push('added ' + Object.entries(tally).map(([k, n]) => n + ' ' + k.toLowerCase() + (n > 1 ? 's' : '')).join(', '));
  if (roads || others) parts.push('updated ' + [roads && roads + ' road' + (roads > 1 ? 's' : ''), others && others + ' other way' + (others > 1 ? 's' : '')].filter(Boolean).join(' and ') + ' (' + [...keys].join(', ') + ')');
  return { creates, modifies, notes, used, errors, summary: parts.length ? 'Ground survey: ' + parts.join('; ') : '' };
}
function oscXml(c, cs) {
  const csAttr = cs ? ` changeset="${cs}"` : '';
  const tags = t => Object.entries(t).map(([k, v]) => `<tag k="${esc(k)}" v="${esc(v)}"/>`).join('');
  let x = `<?xml version="1.0" encoding="UTF-8"?>\n<osmChange version="0.6" generator="${esc(APP)}">\n<create>\n`;
  for (const n of c.creates) x += `<node id="${n.id}" lat="${n.lat.toFixed(7)}" lon="${n.lon.toFixed(7)}" version="0"${csAttr}>${tags(n.tags)}</node>\n`;
  x += '</create>\n<modify>\n';
  for (const w of c.modifies) x += `<way id="${w.id}" version="${w.v}"${csAttr}>${w.nds.map(n => `<nd ref="${n}"/>`).join('')}${tags(w.tags)}</way>\n`;
  return x + '</modify>\n</osmChange>\n';
}

/* ================= upload screen ================= */
let busy = false;
async function renderUpload(showCode) {
  const v = $('#v-upload'); v.innerHTML = '';
  v.append(h('h2', {}, 'Upload to ' + srv().label));
  if (getToken() && !USER) await loadUser();
  const acct = h('div', { class: 'card row' });
  if (USER) acct.append(h('span', { style: 'flex:1' }, 'Signed in as ', h('b', {}, USER.display_name)), h('button', { class: 'btn small', onclick: () => { localStorage.removeItem(tokenKey()); USER = null; renderUpload(); } }, 'Sign out'));
  else acct.append(h('span', { style: 'flex:1' }, 'Sign in with your OSM account to upload.'), h('button', { class: 'btn primary', onclick: signIn }, 'Sign in'));
  v.append(acct);
  if (showCode === true || (S.signin === 'oob' && loadLS('lm.pkce', null) && !USER)) {
    const inp = h('input', { id: 'f-code', placeholder: 'Paste the code OSM showed you' });
    v.append(h('div', { class: 'card stack', style: 'margin-top:10px' }, h('div', { class: 'field' }, h('label', { for: 'f-code' }, 'Authorization code'), inp),
      h('button', { class: 'btn primary', onclick: async () => { try { await exchangeCode(inp.value.trim()); toast('Signed in.'); renderUpload(); } catch (e) { toast(e.message, 7000); } } }, 'Finish sign-in')));
  }
  const items = approved();
  const pend = [...OBS.values()].reduce((n, o) => n + o.anns.filter(a => a.status === 'pending').length, 0);
  v.append(h('h3', {}, 'Ready to send'));
  if (!items.length) { v.append(h('p', { class: 'muted' }, pend ? `Nothing approved yet. ${pend} mark(s) are waiting in Review.` : 'Nothing approved yet. Approve marks in Review first.')); return; }
  v.append(h('p', { class: 'muted small' }, 'Checking current OSM versions…'));
  let c;
  try { c = await compile(navigator.onLine); } catch (e) { v.lastChild.remove(); v.append(h('div', { class: 'err' }, e.message)); return; }
  v.lastChild.remove();
  const list = h('div', { class: 'card stack' });
  c.creates.forEach(n => list.append(h('div', { class: 'mono' }, h('span', { class: 'new' }, '+ node '), Object.entries(n.tags).map(([k, x]) => k + '=' + x).join(' '), h('span', { class: 'muted' }, ` @ ${n.lat.toFixed(5)},${n.lon.toFixed(5)}`))));
  c.modifies.forEach(w => list.append(h('div', { class: 'mono' }, h('span', { class: 'new', style: 'color:var(--mod)' }, '~ way ' + w.id + ' '), w.tags.name || w.tags.highway || w.tags.building && 'building' || '', ' (v' + w.v + ')')));
  c.notes.forEach(({ a }) => list.append(h('div', { class: 'mono' }, h('span', { class: 'new', style: 'color:var(--info)' }, '! note '), (a.text || '').slice(0, 80))));
  v.append(list);
  c.errors.forEach(e => v.append(h('div', { class: 'warn', style: 'margin-top:8px' }, e)));
  const comment = h('textarea', { id: 'f-comment', style: 'min-height:70px' }, c.summary);
  v.append(h('div', { class: 'field', style: 'margin-top:12px' }, h('label', { for: 'f-comment' }, 'Changeset comment (what and where, visible to everyone)'), comment));
  v.append(h('p', { class: 'muted small' }, 'Tagged source=survey with today\'s date. Photos stay on this phone.'));
  if (S.server === 'prod') v.append(h('div', { class: 'warn' }, 'This writes to the live OpenStreetMap database under your name. Switch to the dev sandbox in Settings to rehearse.'));
  const out = h('div', { class: 'stack', style: 'margin-top:10px' });
  const n = c.creates.length + c.modifies.length;
  v.append(h('div', { class: 'row', style: 'margin-top:12px' },
    n ? h('button', { class: 'btn primary', disabled: !USER, onclick: e => doUpload(e.target, comment.value.trim(), out) }, `Upload ${n} change${n > 1 ? 's' : ''}`) : null,
    c.notes.length ? h('button', { class: 'btn', disabled: !USER, onclick: e => postNotes(e.target, out) }, `Post ${c.notes.length} note${c.notes.length > 1 ? 's' : ''}`) : null,
    n ? h('button', { class: 'btn', onclick: () => shareFile(new File([oscXml(c)], `localitymap-${stamp()}.osc`, { type: 'application/xml' })) }, 'Export .osc for JOSM') : null), out);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T-]/g, '');
async function doUpload(btn, comment, out) {
  if (busy) return; if (!comment) return toast('Write a changeset comment first.');
  busy = true; btn.disabled = true; btn.textContent = 'Uploading…'; let cs = null;
  try {
    const c = await compile(true);
    const tags = { created_by: APP, comment, source: 'survey', 'survey:date': new Date().toISOString().slice(0, 10) };
    const body = `<osm><changeset>${Object.entries(tags).map(([k, v]) => `<tag k="${esc(k)}" v="${esc(v)}"/>`).join('')}</changeset></osm>`;
    cs = (await (await api('/api/0.6/changeset/create', { method: 'PUT', headers: { 'Content-Type': 'text/xml' }, body })).text()).trim();
    await api(`/api/0.6/changeset/${cs}/upload`, { method: 'POST', headers: { 'Content-Type': 'text/xml' }, body: oscXml(c, cs) });
    await api(`/api/0.6/changeset/${cs}/close`, { method: 'PUT' });
    for (const { o, a } of c.used) { a.status = 'uploaded'; a.result = 'In changeset ' + cs; saveObs(o); }
    [...new Set(c.used.flatMap(({ o }) => cellsAround(o.cam.lat, o.cam.lon)))].forEach(k => { CELLS.delete(k); store.del('cells', k).catch(() => {}); });
    out.append(h('div', { class: 'card' }, 'Uploaded as changeset ', h('a', { href: `${srv().web}/changeset/${cs}`, target: '_blank', rel: 'noopener' }, cs), '. BeamNG.Earth picks it up after its map sources next refresh.'));
    btn.textContent = 'Done';
  } catch (e) {
    out.append(h('div', { class: 'err' }, e.message + (e.message.includes('409') ? ' Someone edited this since; reload and try again.' : '')));
    if (cs) api(`/api/0.6/changeset/${cs}/close`, { method: 'PUT' }).catch(() => {});
    btn.disabled = false; btn.textContent = 'Try again';
  } finally { busy = false; }
}
async function postNotes(btn, out) {
  if (busy) return; busy = true; btn.disabled = true;
  try {
    const c = await compile(true);
    for (const { o, a } of c.notes) {
      const text = a.text.trim() + `\n\n(Surveyed on the ground ${o.created.slice(0, 10)}, looking ${Math.round(a.bearing)}° from ${o.cam.lat.toFixed(6)},${o.cam.lon.toFixed(6)}.)`;
      const r = await api('/api/0.6/notes.json?' + new URLSearchParams({ lat: a.lat.toFixed(6), lon: a.lon.toFixed(6), text }), { method: 'POST' });
      const j = await r.json(); a.status = 'uploaded'; a.result = 'Note ' + j.properties.id; saveObs(o);
      out.append(h('div', { class: 'card' }, 'Posted ', h('a', { href: `${srv().web}/note/${j.properties.id}`, target: '_blank', rel: 'noopener' }, 'note ' + j.properties.id)));
    }
    btn.textContent = 'Posted';
  } catch (e) { out.append(h('div', { class: 'err' }, e.message)); btn.disabled = false; } finally { busy = false; }
}
async function shareFile(file) {
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: file.name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  const a = h('a', { href: URL.createObjectURL(file), download: file.name }); document.body.append(a); a.click(); a.remove();
}

/* ================= export the raw survey (future-proofing) ================= */
async function exportData(list, withPhotos = true) {
  if (typeof JSZip === 'undefined') return toast('Export needs to load once while online.');
  toast(withPhotos ? `Packing ${list.length} photos…` : 'Packing your review decisions…', 60000);
  const zip = new JSZip(); const meta = [], feats = [];
  for (const o of list) {
    if (withPhotos) zip.file(`photos/${o.id}.jpg`, await geotaggedJpeg(o));
    const C = obsCam(o);
    meta.push({ record: Object.fromEntries(Object.entries(o).filter(([k]) => k !== 'photo')), id: o.id, file: `photos/${o.id}.jpg`, created: o.created, kind: o.kind, trip: o.trip, image: o.img, hfov_long_deg: o.hfovLong,
      camera: { lat: o.cam.lat, lon: o.cam.lon, gps_accuracy_m: o.cam.acc, speed_ms: o.cam.speed, gps_course_deg: o.cam.course, heading_deg: Hd(o), heading_source: o.cam.headingSrc, heading_correction_deg: o.cam.adj || 0, height_m: o.cam.height,
        basis_enu: { forward: C.f, right: C.r, up: C.u } },
      marks: o.anns.map(a => ({ preset: a.preset, x: a.x, y: a.y, status: a.status, way: a.wayId, lat: a.lat, lon: a.lon, distance_m: a.dist, bearing_deg: a.bearing, values: a.values, text: a.text, result: a.result })) });
    feats.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [o.cam.lon, o.cam.lat] }, properties: { id: o.id, created: o.created, heading: Math.round(Hd(o) * 10) / 10, marks: o.anns.length } });
  }
  zip.file('survey.json', JSON.stringify({ app: APP, exported: new Date().toISOString(), frame: 'ENU metres at each camera; basis vectors are unit vectors (east, north, up)', photos: meta, checks: CHECKS, trips: loadLS('lm.trips', {}), with_photos: withPhotos }));
  const trails = []; for (const tid of new Set(list.map(o => o.trip).filter(Boolean))) { const tr = await store.get('trails', tid).catch(() => null); if (tr) trails.push(tr); }
  zip.file('trails.json', JSON.stringify(trails));
  zip.file('cameras.geojson', JSON.stringify({ type: 'FeatureCollection', features: feats }));
  const blob = await zip.generateAsync({ type: 'blob' });
  $('#toast').hidden = true;
  shareFile(new File([blob], `localitymap-${withPhotos ? 'survey' : 'reviews'}-${stamp()}.zip`, { type: 'application/zip' }));
}

function renderSettings() {
  const v = $('#v-settings'); v.innerHTML = '';
  v.append(h('h2', {}, 'Settings'));
  const num = (k, label, step, hint) => { const id = 'set-' + k; const i = h('input', { id, type: 'number', inputmode: 'decimal', step, value: S[k] }); i.onchange = () => { S[k] = Number(i.value); saveSettings(); }; return h('div', { class: 'field' }, h('label', { for: id }, label), h('span', { class: 'cur' }, hint || ''), i); };
  const sel = (k, label, opts) => { const id = 'set-' + k; const s = h('select', { id }, Object.entries(opts).map(([val, l]) => h('option', { value: val, selected: S[k] === val }, l))); s.onchange = () => { S[k] = s.value; saveSettings(); USER = null; ctxCache.clear(); renderSettings(); }; return h('div', { class: 'field' }, h('label', { for: id }, label), s); };
  v.append(h('h3', {}, 'OpenStreetMap account'));
  v.append(sel('server', 'Server', { prod: 'OpenStreetMap (live)', dev: 'Dev sandbox (test edits)' }));

  cid.onchange = () => { S.clientId = cid.value.trim(); saveSettings(); };
  v.append(h('div', { class: 'field' }, h('label', { for: 'set-client' }, 'Client ID'), cid));
  v.append(sel('signin', 'Sign-in method', { redirect: 'Return to this app automatically', oob: 'Copy a code by hand (installed iPhone app)' }));
  v.append(h('p', { class: 'muted small', style: 'margin:0 0 6px' }, `Register an app at ${srv().web}/oauth2/applications/new as a public (non-confidential) client with "Read user preferences", "Modify the map" and "Modify notes". Redirect URI:`));
  v.append(h('div', { class: 'code' }, redirectUri()));
  v.append(h('h3', {}, 'Camera and compass'));
  v.append(num('hfov', 'Camera field of view, long side (°)', 1, 'most phones 63–70'));
  v.append(num('camHeight', 'Camera height on foot (m)', 0.1, 'for tilt distances'));
  v.append(num('declination', 'Magnetic declination (°, east positive)', 0.1, 'added to compass'));
  v.append(h('h3', {}, 'Drive mode'));
  v.append(num('speedSwitch', 'Switch from distance to time above (km/h)', 5));
  v.append(num('distStep', 'Below that: one photo every (m)', 1));
  v.append(num('timeStep', 'Above that: one photo every (s)', 0.5));
  v.append(num('minSpeed', 'Stop shooting below (km/h)', 1, 'avoids piles at lights'));
  v.append(num('mountOffset', 'Mount offset from straight ahead (°)', 0.5, 'set by "Apply to drive"'));
  v.append(num('carCamHeight', 'Mounted camera height (m)', 0.1));
  v.append(num('targetPasses', 'Passes wanted per direction', 1, 'first pass + confirmations'));
  const lv = h('input', { type: 'checkbox', id: 'set-live', checked: S.liveOverlay }); lv.onchange = () => { S.liveOverlay = lv.checked; liveOn = lv.checked; saveSettings(); };
  v.append(h('label', { class: 'toggle', for: 'set-live' }, lv, 'Draw OSM roads over the live camera'));
  v.append(h('h3', {}, 'Review on another device'));
  v.append(h('p', { class: 'muted small', style: 'margin:0 0 8px' }, 'Export from the phone, then open LocalityMap on an iPad or computer and import the zip (AirDrop, Files, email or a USB cable all work). Review and upload there, or export the reviews back: a reviews-only export is small and merges into the phone\'s copy, newest change winning.'));
  const imp = h('input', { type: 'file', accept: '.zip,application/zip', hidden: true, onchange: e => { const f = e.target.files[0]; e.target.value = ''; if (f) importSurvey(f).catch(err => toast('Import failed: ' + err.message, 7000)); } });
  v.append(h('div', { class: 'row', style: 'margin-bottom:8px' }, h('button', { class: 'btn small', onclick: () => exportData([...OBS.values()], true) }, 'Export with photos'),
    h('button', { class: 'btn small', onclick: () => exportData([...OBS.values()], false) }, 'Export reviews only'), h('label', { class: 'btn small' }, 'Import a zip', imp)));
  v.append(h('h3', {}, 'Data on this device'));
  const done = [...OBS.values()].filter(o => o.anns.length ? o.anns.every(a => ['uploaded', 'rejected', 'merged'].includes(a.status)) : false);
  const info = h('span', { class: 'muted', style: 'flex:1' }, `${OBS.size} photos stored, ${done.length} fully done.`);
  v.append(h('div', { class: 'row' }, info,
    done.length ? twoTap(h('button', { class: 'btn small danger' }, 'Remove finished'), 'Remove finished', async () => { await deleteObs(done); renderSettings(); toast('Removed finished photos.'); }) : null));
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { info.textContent += ` Using ${Math.round(e.usage / 1e6)} MB of about ${Math.round(e.quota / 1e6)} MB.`; }).catch(() => {});
  v.append(h('p', { class: 'muted', style: 'font-size:12px;margin-top:24px' }, APP + ' · map data © OpenStreetMap contributors, ODbL'));
}
